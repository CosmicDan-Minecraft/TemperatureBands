plugins {
    id 'com.gradleup.shadow'
}

apply from: '../modprops.gradle'
//base { archivesName = "$rootProject.archives_name-$project.name" }
base { archivesName = project.archives_base_name }
version = project.mod_version + "-Fabric-${rootProject.minecraft_version}"
group = project.maven_group

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    //modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
    
    // Caffeine library (fast LruCache) - https://github.com/ben-manes/caffeine
    include "com.github.ben-manes.caffeine:caffeine:3.2.4"
    
    // World Preview
    modImplementation "curse.maven:world-preview-891429:5686700"

    // Forge config API port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.forgeconfigapiport_version"
}

processResources {
    filesMatching('fabric.mod.json') {
        expand([
                version: project.mod_version,
                minecraft_version: rootProject.minecraft_version,
                java_version: rootProject.java_version,
                fabric_loader_version: rootProject.fabric_loader_version,
                forgeconfigapiport_version: rootProject.forgeconfigapiport_version
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    //Old, might still be needed...?
    //dependsOn shadowJar
    archiveClassifier = null
}

// Extras from CosmicDan, check if these are still needed...

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.named('build') {
    finalizedBy 'copyJar', 'copySourcesJar'
}

tasks.register('copyJar', Copy) {
    dependsOn tasks.remapJar
    from tasks.remapJar.outputs.files
    into layout.projectDirectory.dir("../build")
}

tasks.register('copySourcesJar', Copy) {
    dependsOn tasks.sourcesJar
    from tasks.sourcesJar.outputs.files
    into layout.projectDirectory.dir("../build")
}
