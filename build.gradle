plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
}

apply from: 'modprops.gradle'
group = project.maven_group
version = project.mod_version

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
	// Removed and applied to root (above) and individual subprojects for multiproject compat.
    //group = 
    //version =
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    // Removed and applied to individual subprojects for multiproject compat.
    //base {
    //    // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
    //    archivesName = "$rootProject.archives_name-$project.name"
    //}
    
    repositories {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
        
        // CurseForge
        maven { url = "https://cursemaven.com" }
        
        // Forge Config API Port
        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }
        
        // Modrinth (for World Preview NeoForge 1.21.1 port)
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
        // Caffeine library (fast LruCache) - https://github.com/ben-manes/caffeine
        implementation("com.github.ben-manes.caffeine:caffeine:3.2.4")
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = rootProject.java_version.toInteger()
        targetCompatibility = rootProject.java_version.toInteger()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = rootProject.java_version.toInteger()
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

tasks.register('clean', Delete) {
    group = "build"
    delete rootProject.layout.buildDirectory

    doLast {
        delete 'build/'
    }
}
