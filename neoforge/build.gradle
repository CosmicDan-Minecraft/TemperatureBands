plugins {
    id 'com.gradleup.shadow'
}

apply from: '../modprops.gradle'
//base { archivesName = "$rootProject.archives_name-$project.name" }
base { archivesName = project.archives_base_name }
version = project.mod_version + "-NeoForge-${rootProject.minecraft_version}"
group = project.maven_group

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    
    // Caffeine library (fast LruCache) - https://github.com/ben-manes/caffeine
    forgeRuntimeLibrary("com.github.ben-manes.caffeine:caffeine:3.2.4")
    include "com.github.ben-manes.caffeine:caffeine:3.2.4"
    
    // JOL (temp for measuring object size)
    //forgeRuntimeLibrary 'org.openjdk.jol:jol-core:0.17'
    //include 'org.openjdk.jol:jol-core:0.17'
    
    // World Preview (Unofficial Port)
    modImplementation "curse.maven:world-preview-unofficial-port-1634892:9436397"
    
    // Chunky
    localRuntime "curse.maven:chunky-pregenerator-forge-485681:6383261"
    
    // Performance mods
    //modLocalRuntime("curse.maven:zfastnoise-1460602:7976498")
    
    // TESTING MODS
    // Tectonic
    //modImplementation("curse.maven:lithostitched-936015:9170709")
    //include("curse.maven:lithostitched-936015:9170709")
    //modImplementation("curse.maven:tectonic-686836:8855043")
    //include("curse.maven:tectonic-686836:8855043")
    //modImplementation "maven.modrinth:apollib:1.2.0-neoforge-21.1"
    //include "maven.modrinth:apollib:1.2.0-neoforge-21.1"
    //implementation "de.marhali:json5-java:3.0.0"
    //include "de.marhali:json5-java:3.0.0"
    //forgeRuntimeLibrary "de.marhali:json5-java:3.0.0"
    // Lithosphere
    //modImplementation files('lithosphere 1.6 17.06.2025 (1.20.5 - 1.21.5).jar')
    // Larion
    //modImplementation "curse.maven:larion-world-generation-1150582:6315772"
    // Continents
    //modImplementation "curse.maven:continents-682515:8396863"

    // Compat. testing (modded BiomeSource)
    //modImplementation "curse.maven:blueprint-382216:8048607"
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
                version                : project.mod_version,
                minecraft_version      : project.minecraft_version,
                neoforge_version       : project.neoforge_version,
                neoforge_loader_version: project.neoforge_loader_version
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    //Old, might still be needed...?
    //dependsOn shadowJar
    archiveClassifier = null
    injectAccessWidener = true
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
}

// Extras from CosmicDan, check if these are still needed...

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.named('build') {
    finalizedBy 'copyJar', 'copySourcesJar'
}

tasks.register('copyJar', Copy) {
    dependsOn tasks.remapJar
    from tasks.remapJar.outputs.files
    into layout.projectDirectory.dir("../build")
}

tasks.register('copySourcesJar', Copy) {
    dependsOn tasks.sourcesJar
    from tasks.sourcesJar.outputs.files
    into layout.projectDirectory.dir("../build")
}
