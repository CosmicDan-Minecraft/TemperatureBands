plugins {
    id 'com.gradleup.shadow'
}

apply from: '../modprops.gradle'
//base { archivesName = "$rootProject.archives_name-$project.name" }
base { archivesName = project.archives_base_name }
version = project.mod_version + "-NeoForge-${rootProject.minecraft_version}"
group = project.maven_group

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    
    // Caffeine library (fast LruCache) - https://github.com/ben-manes/caffeine
    forgeRuntimeLibrary("com.github.ben-manes.caffeine:caffeine:3.2.4")
    include "com.github.ben-manes.caffeine:caffeine:3.2.4"
    
    // World Preview (NeoForge port via Modrinth)
    modImplementation("maven.modrinth:world-preview-neoforged-(unofficial):y3St0do0")
    modLocalRuntime("curse.maven:zfastnoise-1460602:7976498")
    
    // TESTING MODS
    // Tectonic
    //modImplementation("curse.maven:lithostitched-936015:8252082")
    //modImplementation("curse.maven:tectonic-686836:7903156")
    // Lithosphere
    //modImplementation files('lithosphere 1.6 17.06.2025 (1.20.5 - 1.21.5).jar')
    // Larion
    //modImplementation "curse.maven:larion-world-generation-1150582:6315772"

    // Compat. testing (modded BiomeSource)
    //modImplementation "curse.maven:blueprint-382216:8048607"
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
                version                : project.mod_version,
                minecraft_version      : project.minecraft_version,
                neoforge_version       : project.neoforge_version,
                neoforge_loader_version: project.neoforge_loader_version
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    //Old, might still be needed...?
    //dependsOn shadowJar
    archiveClassifier = null
}

// Extras from CosmicDan, check if these are still needed...

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.named('build') {
    finalizedBy 'copyJar', 'copySourcesJar'
}

tasks.register('copyJar', Copy) {
    dependsOn tasks.remapJar
    from tasks.remapJar.outputs.files
    into layout.projectDirectory.dir("../build")
}

tasks.register('copySourcesJar', Copy) {
    dependsOn tasks.sourcesJar
    from tasks.sourcesJar.outputs.files
    into layout.projectDirectory.dir("../build")
}
