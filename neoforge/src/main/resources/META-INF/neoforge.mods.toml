modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/CosmicDan-Minecraft/TemperatureBands/issues"
license = "LGPLv3"

[[mods]]
modId = "temperaturebands"
version = "${version}"
displayName = "Temperature Bands"
authors = "CosmicDan"
description = '''
Modifies world generation to place biomes into repeating temperature bands. Compatible with most worldgen mods.

https://www.curseforge.com/minecraft/mc-mods/temperaturebands
'''
logoFile = "logo.png"

[[dependencies.temperaturebands]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.temperaturebands]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.temperaturebands]]
modId = "world_preview"
type = "optional"
versionRange = "[1,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "temperaturebands.mixins.json"

[[mixins]]
config = "temperaturebands-neoforge.mixins.json"
